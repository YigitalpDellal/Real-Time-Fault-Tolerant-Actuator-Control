name: Restore validated project

on:
  push:
    paths:
      - ".github/workflows/bootstrap-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore package
        shell: bash
        run: |
          set -euo pipefail
          cp README.md /tmp/README.final.md
          cat .bootstrap/chunk_aa .bootstrap/chunk_ab .bootstrap/chunk_ac > /tmp/bootstrap.b64
          rem=$(( $(wc -c < /tmp/bootstrap.b64) % 4 ))
          if [ "$rem" -eq 2 ]; then printf '==' >> /tmp/bootstrap.b64; fi
          if [ "$rem" -eq 3 ]; then printf '=' >> /tmp/bootstrap.b64; fi
          base64 --decode /tmp/bootstrap.b64 > /tmp/bootstrap.gz
          gzip --test /tmp/bootstrap.gz
          gzip --decompress --stdout /tmp/bootstrap.gz > /tmp/bootstrap.payload
          if unzip -t /tmp/bootstrap.payload >/dev/null 2>&1; then
            unzip -o /tmp/bootstrap.payload -d .
          else
            tar -xf /tmp/bootstrap.payload -C .
          fi
          cp /tmp/README.final.md README.md
          rm -rf .bootstrap
      - name: Commit restored files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore validated project files"
          git push
