name: Add portfolio media and evidence

on:
  push:
    paths:
      - ".github/workflows/add-media.yml"

permissions:
  contents: write

jobs:
  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add real hardware media
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/media/01-hardware docs/media/06-integration
          curl --fail --location --retry 3             "https://raw.githubusercontent.com/YigitalpDellal/Real-Time-Electro-Optical-Platform/main/docs/media/hardware_overview.jpg"             -o docs/media/01-hardware/system-overview.jpg
          curl --fail --location --retry 3             "https://raw.githubusercontent.com/YigitalpDellal/Real-Time-Electro-Optical-Platform/main/docs/media/pan_tilt_motion.mp4"             -o docs/media/06-integration/02-realtime-pan-tilt-demo.mp4
          ffmpeg -loglevel error -y             -i docs/media/06-integration/02-realtime-pan-tilt-demo.mp4             -frames:v 1 docs/media/06-integration/02-realtime-pan-tilt-demo-thumb.jpg

      - name: Generate measured evidence figures
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet matplotlib
          mkdir -p             docs/media/08-deadline-fault             docs/media/09-priority-inversion             docs/media/10-rm-vs-dm             docs/media/11-validation

          python3 - <<'PY'
          import matplotlib.pyplot as plt

          # Fault-containment comparison
          services = ["CONTROL", "COMM", "HEALTH", "MONITOR", "LOGGER"]
          raw = [100, 41, 20, 10, 2]
          supervised = [3, 1, 0, 0, 0]
          x = range(len(services))
          w = 0.36
          fig, ax = plt.subplots(figsize=(10, 5.5))
          ax.bar([i-w/2 for i in x], raw, width=w, label="Raw overload")
          ax.bar([i+w/2 for i in x], supervised, width=w, label="With supervision")
          ax.set_xticks(list(x), services)
          ax.set_ylabel("Deadline misses")
          ax.set_title("Deadline-Fault Containment")
          ax.legend()
          ax.grid(axis="y", alpha=0.25)
          fig.tight_layout()
          fig.savefig("docs/media/08-deadline-fault/03-supervised-timing-results.png", dpi=180)
          plt.close(fig)

          # State-recovery timeline
          fig, ax = plt.subplots(figsize=(10, 3.4))
          times = [0.0, 4.025, 4.075, 6.480, 10.0]
          states = [2, 1, 0, 2, 2]
          ax.step(times, states, where="post")
          ax.set_yticks([0,1,2], ["SAFE","DEGRADED","NORMAL"])
          ax.set_xlim(0,10)
          ax.set_xlabel("Time (s)")
          ax.set_title("Supervised State Recovery")
          ax.grid(alpha=0.25)
          fig.tight_layout()
          fig.savefig("docs/media/08-deadline-fault/04-supervised-state-recovery.png", dpi=180)
          plt.close(fig)

          # Priority inversion
          fig, ax = plt.subplots(figsize=(7.5, 5))
          ax.bar(["No inheritance", "PTHREAD_PRIO_INHERIT"], [220.222, 70.119])
          ax.set_ylabel("HIGH blocking time (ms)")
          ax.set_title("Priority Inheritance: Measured HIGH Blocking")
          ax.grid(axis="y", alpha=0.25)
          fig.tight_layout()
          fig.savefig("docs/media/09-priority-inversion/01-priority-inheritance-comparison.png", dpi=180)
          plt.close(fig)

          # RM vs DM
          fig, ax = plt.subplots(figsize=(7.5, 5))
          ax.bar(["Rate Monotonic", "Deadline Monotonic"], [25, 0])
          ax.set_ylabel("URGENT_B deadline misses / 100")
          ax.set_title("Constrained-Deadline Task: RM vs DM")
          ax.grid(axis="y", alpha=0.25)
          fig.tight_layout()
          fig.savefig("docs/media/10-rm-vs-dm/02-urgent-task-comparison.png", dpi=180)
          plt.close(fig)

          # 60-second service deadline results
          jobs = [3000,1200,600,300,60]
          misses = [0,0,0,0,0]
          fig, ax = plt.subplots(figsize=(9, 5.2))
          ax.bar(services, jobs)
          ax.set_ylabel("Jobs completed")
          ax.set_title("60-Second Powered Validation: 5,160 Jobs, 0 Deadline Misses")
          for i, (job, miss) in enumerate(zip(jobs, misses)):
              ax.text(i, job, f"{job}\nmisses: {miss}", ha="center", va="bottom")
          ax.grid(axis="y", alpha=0.25)
          fig.tight_layout()
          fig.savefig("docs/media/11-validation/03-60s-physical-validation-timing.png", dpi=180)
          plt.close(fig)

          # Final validation summary card
          fig, ax = plt.subplots(figsize=(10, 5))
          ax.axis("off")
          summary = (
              "60-SECOND POWERED VALIDATION\n\n"
              "Periodic jobs: 5,160\n"
              "Deadline misses: 0\n"
              "Successful UART transactions: 1,261\n"
              "Failed UART transactions: 0\n"
              "Final health state: HEALTHY\n"
              "Final setpoint: PAN 90° / TILT 90°\n"
              "Observed utilization: 0.069792\n"
              "RM sufficient bound (5 tasks): ≈ 0.7435"
          )
          ax.text(0.04, 0.95, summary, va="top", family="monospace", fontsize=15)
          fig.tight_layout()
          fig.savefig("docs/media/11-validation/04-60s-physical-validation-summary.png", dpi=180)
          plt.close(fig)
          PY

      - name: Commit media and evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/media
          git commit -m "Add real hardware media and measured experiment evidence"
          git push
