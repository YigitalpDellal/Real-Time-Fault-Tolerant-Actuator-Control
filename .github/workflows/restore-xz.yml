name: Restore validated project package

on:
  push:
    paths:
      - ".github/workflows/restore-xz.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild and verify validated package
        shell: bash
        run: |
          set -euo pipefail

          cp README.md /tmp/README.final.md

          cat             .bootstrap/xz_00             .bootstrap/xz_01             .bootstrap/xz_02             .bootstrap/xz_03             .bootstrap/xz_04             .bootstrap/xz_05             .bootstrap/xz_06             .bootstrap/xz_07             .bootstrap/xz_08             .bootstrap/xz_09             .bootstrap/xz_10             > /tmp/source.b64

          base64 --decode /tmp/source.b64 > /tmp/source.tar.xz

          echo "3a9360ecfc5f2692e53cae0bae0e687809419f3e4cd0f7053696e269d39c8931  /tmp/source.tar.xz"             | sha256sum --check -

          xz --test /tmp/source.tar.xz
          xz --decompress --stdout /tmp/source.tar.xz > /tmp/source.tar
          tar -tf /tmp/source.tar >/dev/null
          tar -xf /tmp/source.tar -C .

          cp /tmp/README.final.md README.md

      - name: Remove temporary bootstrap machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
          rm -f .github/workflows/bootstrap-v2.yml
          rm -f .github/workflows/restore-xz.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit restored project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore validated project source, tests and results"
          git push
